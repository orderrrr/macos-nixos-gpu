# Base config, on top of Noctalia's defaults. The settings UI saves its changes to the persisted
# ~/.local/state/noctalia/settings.toml, which overrides this file.

# Noctalia's default bar without network, bluetooth, brightness and battery: the VM has no
# network manager, Bluetooth, backlight or battery.
[bar.default]
start = ["launcher", "wallpaper", "workspaces"]
center = ["clock"]
end = ["tray", "notifications", "clipboard", "volume", "control-center", "session"]

# Apps from the launcher run as their own transient units, so they survive Noctalia exiting
# (5.4.1 can die on a Wayland protocol error, and restarting its unit would take them along).
[shell]
launch_apps_as_systemd_services = true
